<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git Graph</title>
    <link rel="stylesheet" type="text/css" href="/out.min.css">
    <link rel="stylesheet" type="text/css" href="/theme.css">
    <script src="/signalr.min.js"></script>
    <!-- Graph branch colours injected by server via /api/initialState -->
</head>
<body>
    <div id="view" tabindex="-1">
        <div id="controls">
            <span id="repoControl"><span class="unselectable">Repo: </span><div id="repoDropdown" class="dropdown"></div></span>
            <span id="branchControl"><span class="unselectable">Branches: </span><div id="branchDropdown" class="dropdown"></div></span>
            <label id="showRemoteBranchesControl"><input type="checkbox" id="showRemoteBranchesCheckbox" tabindex="-1"><span class="customCheckbox"></span>Show Remote Branches</label>
            <div id="findBtn" title="Find" style="display: none;"></div>
            <div id="terminalBtn" title="Open a Terminal for this Repository" style="display: none;"></div>
            <div id="settingsBtn" title="Repository Settings"></div>
            <div id="fetchBtn"></div>
            <div id="refreshBtn"></div>
        </div>
        <div id="content">
            <div id="commitGraph"></div>
            <div id="commitTable"></div>
        </div>
        <div id="footer"></div>
    </div>
    <div id="scrollShadow"></div>

    <script>
        // Fetch initial state from the backend before loading the main script.
        // The three globals (initialState, globalState, workspaceState) are
        // expected to exist synchronously when out.min.js starts executing, so
        // we dynamically append the <script> tag only after the fetch resolves.
        (function () {
            fetch('/api/initialState')
                .then(function (res) { return res.json(); })
                .then(function (data) {
                    window.initialState    = data.initialState;
                    window.globalState     = data.globalState;
                    window.workspaceState  = data.workspaceState;

                    // Apply graph branch colour CSS variables injected by server
                    if (data.colorVars) {
                        var style = document.createElement('style');
                        style.textContent = 'body{' + data.colorVars + '} ' + data.colorParams;
                        document.head.appendChild(style);
                    }

                    var s = document.createElement('script');
                    s.src = '/out.min.js';
                    // The window 'load' event fires before this script is
                    // dynamically injected, so we re-dispatch it once out.min.js
                    // has parsed and registered its listener.
                    s.onload = function() {
                        window.dispatchEvent(new Event('load'));
                    };
                    document.body.appendChild(s);
                })
                .catch(function (err) {
                    document.body.innerHTML =
                        '<h2>Unable to load Git Graph</h2>' +
                        '<p>Could not connect to the Git Graph backend: ' + err + '</p>';
                });
        })();
    </script>

    <!-- Diff viewer dialog — opened in-page instead of a new window -->
    <dialog id="diffDialog">
        <div id="diffDialogInner">
            <div id="diffDialogHeader">
                <button id="diffDialogClose" title="Close (Esc)">&times;</button>
            </div>
            <iframe id="diffDialogFrame" src="about:blank"></iframe>
        </div>
    </dialog>
    <style>
        #diffDialog {
            width: 92vw;
            height: 92vh;
            max-width: 92vw;
            max-height: 92vh;
            padding: 0;
            border: 1px solid #454545;
            border-radius: 6px;
            background: #1e1e1e;
            overflow: hidden;
        }
        #diffDialog::backdrop { background: rgba(0, 0, 0, 0.55); }
        #diffDialogInner {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }
        #diffDialogHeader {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            background: #252526;
            border-bottom: 1px solid #3c3c3c;
            flex-shrink: 0;
            padding: 2px 4px;
        }
        #diffDialogClose {
            background: none;
            border: none;
            color: #cccccc;
            font-size: 1.2rem;
            line-height: 1;
            padding: 3px 8px;
            cursor: pointer;
            border-radius: 3px;
        }
        #diffDialogClose:hover { background: #3a3d41; color: #ffffff; }
        #diffDialogFrame { flex: 1; border: none; width: 100%; min-height: 0; }
    </style>
</body>
</html>
